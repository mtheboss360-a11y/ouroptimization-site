# --- Old call links ---
# The call form moved from the home page to /contact (October 22, 2026). Links such as
# /?about=flyer-drops#call keep working: the about value carries over and prefills the message.
# Only requests that carry ?about= match this rule; the plain home page is untouched.
[[redirects]]
  from = "/"
  to = "/contact?about=:about"
  status = 301
  force = true
  query = {about = ":about"}

# --- Retired pages ---
# The old community marketing service pages were retired in October 2026 (their .html files are
# deleted). Each 301s, with and without .html, straight to the page that now covers it. Point new
# rules at the final target, never at another redirected path, so there are no chains.
# /client-portal (its own page from October 22, 2026; the portal now shows on the home page, the flyer network and the referral network)

# OUR Optimization — static site, no build step.
# The campaign-estimate form is handled by Netlify Forms (data-netlify="true" in
# estimate.html): submissions appear under Forms in the Netlify UI, and email
# alerts are set in Site configuration > Notifications > Form submission notifications.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'"

# "Who it's for" became "Industries" in the 2026 repositioning; keep old links working.
[[redirects]]
  from = "/who-its-for"
  to = "/industries"
  status = 301
  force = true

[[redirects]]
  from = "/who-its-for.html"
  to = "/industries"
  status = 301
  force = true

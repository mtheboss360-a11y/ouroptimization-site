# Our Wellness Network (OUR Optimization LLC): static site, no build step.
# Two Netlify Forms (data-netlify="true" in the static HTML): "dinner-call" on the contact
# page (contact.html, #call, posts to /thanks) and "expo-vendor" on expo-vendors.html.
# Submissions appear under Forms in the Netlify UI, and email alerts are set in
# Site configuration > Notifications > Form submission notifications.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'"

# Favicon set (linked from every page head): pin the content types.
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Content-Type = "image/x-icon"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# --- URL standardization ---
# Extensionless URLs are canonical; the .html URL of every kept page 301s to its clean URL.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/patient-network.html"
